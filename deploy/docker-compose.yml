services:
  locket:
    build: ../server
    restart: unless-stopped
    environment:
      LOCKET_ADDR: ":8080"
      LOCKET_DATA_DIR: "/data"
      # Optional: require this token on every /v1 request.
      LOCKET_ACCESS_TOKEN: "${LOCKET_ACCESS_TOKEN:-}"
    volumes:
      - locket-data:/data
    ports:
      - "${LOCKET_PORT:-8080}:8080"

volumes:
  locket-data:
